# Render Blueprint — Keşf (Docker, ücretsiz katman)
# Render panelinde: New + → Blueprint → bu repoyu seç.
# API embedding yolu: model sunucuda yok -> Free (512 MB) RAHAT sığar.
services:
  - type: web
    name: kesf
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SEKINE_EMBEDDER
        value: jina
      - key: JINA_API_KEY
        sync: false          # gizli: Render panelinde Environment'a elle gir (commit'lenmez)
      - key: ADMIN_SIFRE
        sync: false          # /admin paneli şifresi — Render Environment'ta ayarla (yoksa varsayılan 'kesf-admin')
