# Render Blueprint — Keşf (Docker, ücretsiz katman)
# Render panelinde: New + → Blueprint → bu repoyu seç.
services:
  - type: web
    name: kesf
    runtime: docker
    plan: free                 # 512 MB RAM — model sınırda; OOM olursa plan yükselt ya da API yoluna geç
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SEKINE_EMBEDDER
        value: fastembed        # torch'suz ONNX yolu
      - key: FE_THREADS
        value: "1"              # düşük RAM için tek thread
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"              # Linux bellek parçalanmasını azaltır
