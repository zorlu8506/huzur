<!-- ============ Keşf · favicon + meta ============ -->
<!-- Kök dizine kopyala: favicon.svg, favicon.ico, apple-touch-icon.png,
     icon-192.png, icon-512.png, og-image.png, site.webmanifest -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0e1030">

<!-- Open Graph / paylaşım -->
<meta property="og:type" content="website">
<meta property="og:title" content="Keşf — Kendini Keşfet">
<meta property="og:description" content="Psikolojik duruma göre Kur'an, Risale-i Nur ve kanıta dayalı psikoloji; dört katmanlı bir akışla kendine dönüş.">
<meta property="og:url" content="https://www.keshf.online/">
<meta property="og:image" content="https://www.keshf.online/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="tr_TR">

<!-- Twitter/X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Keşf — Kendini Keşfet">
<meta name="twitter:description" content="Sükûnet içinde kendine dönüş.">
<meta name="twitter:image" content="https://www.keshf.online/og-image.png">
